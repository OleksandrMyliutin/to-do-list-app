<section class="new-schedule">
    <div class="container">
        <div class="new-schedule-header">
            <button class="new-schedule-header-button">
                <svg class="new-shedule-header-button-icon" width="24" height="24">
                    <use href="/img/arrow-left.svg#bi:arrow-left"></use>
                </svg>
            </button>
            <ul class="new-schedule-header-list">
                <li class="new-schedule-header-list-item">
                    <button class="new-schedule-header-list-item-button">
                        <svg class="new-schedule-header-list-item-button-icon" width="24" height="24">
                            <use href="/img/checkBox.svg#Rectangle 7"></use>
                        </svg>
                        <svg class="new-schedule-header-list-item-button-iconIn" width="20" height="20">
                            <use href="/img/checkMark.svg#Frame 57"></use>
                        </svg>
                    </button>
                </li>
                <li class="new-schedule-header-list-item">
                    <button class="new-schedule-header-list-item-button">
                        <svg class="new-schedule-header-list-item-button-icon" width="24" height="24">
                            <use href="/img/checkMark.svg#Frame 57"></use>
                        </svg>
                    </button>
                </li>
            </ul>
        </div>
        <div class="wrapper">
            <form class="wrapper-note-form">
                <div class="wrapper-note-form-group">
                    <label for="textTitle" class="wrapper-note-form-group-label title">Schedule</label>
                    <input class="wrapper-note-form-group-input" type="text" id="textTitle" placeholder="Title" />
                </div>
                <div class="wrapper-note-form-group">
                    <label  class="wrapper-note-form-group-label" for="toggle">Full day</label>
                    <div class="wrapper-note-form-group-toggle" id="toggle">
                        <span class="wrapper-note-form-group-toggle-circle" id="circle"></span>
                        </span>
                    </div>
                </div>
                <div class="wrapper-note-form-group">
                    <label  class="wrapper-note-form-group-label" for="calendar">Start from</label>
                    <div class="wrapper-note-form-group-calendar">
                        <button class="wrapper-note-form-group-calendar-btn"></button>
                        <input type="date" id="realDateInput" class="wrapper-note-form-group-calendar-date" />
                    </div>
                </div>
                <div class="wrapper-note-form-group">
                    <labe  class="wrapper-note-form-group-label" for="calendar">Finish</labe>
                    <input class="wrapper-note-form-group-calendar" type="text" id="calendar"/>
                </div>
                <!-- <textarea class="note-form-textarea" name="your-text" id="" placeholder="Your-text"></textarea> -->
            </form>
        </div>
    </div>
</section>
